<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>限時動態 | Stories</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #00f2fe;
            --text-color: #e0e0e0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', -apple-system, sans-serif;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* 導航列 */
        .navbar {
            background-color: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* 包廂標籤樣式 */
        .room-badge {
            background: #2a2a2a;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .room-badge:hover {
            background: var(--accent-color);
            color: #000;
        }

        /* 上傳區域 */
        .upload-section {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid #333;
        }

        .form-control {
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: white;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            resize: none;
        }

        .form-control:focus {
            background-color: #2a2a2a;
            color: white;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 0.25rem rgba(0, 242, 254, 0.25);
        }

        .btn-primary {
            background: linear-gradient(45deg, #00f2fe 0%, #4facfe 100%);
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-weight: 600;
            font-size: 18px;
        }

        .custom-file-upload {
            display: block;
            width: 100%;
            background: #333;
            color: #aaa;
            text-align: center;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            cursor: pointer;
            border: 2px dashed #555;
            font-size: 16px;
        }

        /* 限動卡片控制 */
        .story-card {
            background-color: var(--card-bg);
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 30px;
            border: 1px solid #333;
            width: 100%;
        }

        .story-img {
            width: 100%;
            height: auto;
            max-height: 70vh;
            display: block;
            object-fit: cover;
        }

        .story-content {
            padding: 20px;
        }

        .story-text {
            font-size: 1.1rem;
            line-height: 1.5;
            white-space: pre-wrap;
            margin-bottom: 10px;
        }

        .story-time {
            font-size: 0.85rem;
            color: #777;
        }

        /* 放大檢視遮罩 */
        #imageOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            cursor: zoom-out;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="container d-flex flex-column align-items-center py-2">
        <span class="text-white fw-bold mb-1" style="letter-spacing: 2px;">STORIES</span>
        <!-- 包廂顯示與切換 -->
        <div id="roomDisplay" class="room-badge" onclick="toggleRoomInput()">🏠 包廂: lobby</div>
        <div id="roomInputGroup" class="mt-2 w-100" style="display: none; max-width: 300px;">
            <div class="input-group">
                <input type="text" id="roomInput" class="form-control py-1 px-2" style="font-size: 14px; height: auto;" placeholder="輸入新代號">
                <button class="btn btn-sm btn-info text-dark fw-bold" onclick="changeRoom()">進入</button>
            </div>
        </div>
    </div>
</nav>

<div class="container" style="max-width: 600px;">
    <!-- 上傳區塊 -->
    <div class="upload-section">
        <label for="fileInput" class="custom-file-upload" id="fileLabel">📸 點擊選擇照片</label>
        <input type="file" id="fileInput" accept="image/*" style="display: none;">
        
        <div class="mb-3">
            <textarea id="textContent" class="form-control" rows="3" placeholder="說點什麼心情..."></textarea>
        </div>
        
        <button class="btn btn-primary w-100" id="uploadBtn" onclick="uploadStory()">發佈限時動態</button>
    </div>

    <h5 class="mt-5 mb-4 text-center" style="color: #888; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px;">最新動態 (24h)</h5>

    <!-- 列表顯示區塊 -->
    <div id="storyList" class="row justify-content-center">
        <div class="text-center py-5">
            <div class="spinner-border text-info" role="status"></div>
        </div>
    </div>
</div>

<!-- 放大檢視的遮罩層 -->
<div id="imageOverlay" onclick="closeImage()">
    <img id="expandedImg" style="max-width: 95%; max-height: 95%; border-radius: 10px; box-shadow: 0 0 20px rgba(255,255,255,0.1); object-fit: contain;">
</div>

<script>
    // --- 請填入你的 Supabase 資訊 ---
    const _supabase = supabase.createClient('https://bumtcazpeeqdnhbdvahm.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1bXRjYXpwZWVxZG5oYmR2YWhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0NzkxNjMsImV4cCI6MjA5NDA1NTE2M30.nYJ22R9cqSCb0cO3NjJe5KLmCZEOC-v7AFk0r5zD3Dg');

    // 包廂邏輯
    let currentRoom = window.location.hash.substring(1) || 'lobby';
    document.getElementById('roomDisplay').innerText = `🏠 包廂: ${currentRoom}`;
    document.getElementById('roomInput').value = currentRoom;

    function toggleRoomInput() {
        const group = document.getElementById('roomInputGroup');
        group.style.display = group.style.display === 'none' ? 'block' : 'none';
    }

    function changeRoom() {
        const val = document.getElementById('roomInput').value.trim();
        if(val) {
            window.location.hash = val;
            location.reload();
        }
    }

    // 顯示選擇狀態
    document.getElementById('fileInput').onchange = function() {
        if(this.files[0]) {
            document.getElementById('fileLabel').innerHTML = "✅ 已選擇照片";
            document.getElementById('fileLabel').style.borderColor = "#00f2fe";
            document.getElementById('fileLabel').style.color = "#00f2fe";
        }
    };

    async function uploadStory() {
        const fileInput = document.getElementById('fileInput');
        const file = fileInput.files[0];
        const content = document.getElementById('textContent').value;
        const btn = document.getElementById('uploadBtn');

        if (!file) { alert("請先選擇一張照片"); return; }

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> 上傳中...';

        try {
            const fileName = `public/${Date.now()}.png`;
            const { data: uploadData, error: uploadError } = await _supabase.storage
                .from('photos')
                .upload(fileName, file);

            if (uploadError) throw uploadError;

            const { data: urlData } = _supabase.storage.from('photos').getPublicUrl(fileName);
            const imgUrl = urlData.publicUrl;

            const { error: dbError } = await _supabase
                .from('stories')
                .insert([{ content: content, image_url: imgUrl, room_id: currentRoom }]);

            if (dbError) throw dbError;
            location.reload();
        } catch (err) {
            alert("錯誤: " + (err.message || "上傳失敗"));
            btn.disabled = false;
            btn.innerHTML = '發佈到此包廂';
        }
    }

    async function loadStories() {
        const yesterday = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
        
        const { data, error } = await _supabase
            .from('stories')
            .select('*')
            .gt('created_at', yesterday)
            .eq('room_id', currentRoom)
            .order('created_at', { ascending: false });

        const container = document.getElementById('storyList');
        container.innerHTML = "";
        
        if (error || !data || data.length === 0) {
            container.innerHTML = '<div class="text-center text-muted mt-4">目前沒有動態</div>';
            return;
        }

        data.forEach(s => {
            const timeStr = new Date(s.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            container.innerHTML += `
                <div class="col-12">
                    <div class="story-card shadow">
                        <img src="${s.image_url}" class="story-img" loading="lazy" onclick="expandImage(this.src)" style="cursor: zoom-in;">
                        <div class="story-content">
                            <p class="story-text text-white">${s.content || ""}</p>
                            <span class="story-time">今天 ${timeStr}</span>
                        </div>
                    </div>
                </div>`;
        });
    }

    function expandImage(src) {
        const overlay = document.getElementById('imageOverlay');
        const fullImg = document.getElementById('expandedImg');
        fullImg.src = src;
        overlay.style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    function closeImage() {
        document.getElementById('imageOverlay').style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    loadStories();
</script>
</body>
</html>
